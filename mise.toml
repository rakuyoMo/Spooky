[tasks.build]
description = "编译核心库与 App 的 debug 版本"
run = "swift build --package-path SpookyKit"

[tasks.test]
description = "运行默认开启的单元测试"
run = "swift test --package-path SpookyKit"

[tasks.bundle]
description = "编译 release 版本，打包为 build/Spooky.app 并 ad-hoc 签名"
run = "./scripts/bundle.sh"

[tasks."swift:format"]
description = "格式化 Swift 代码"
run = "swift package --package-path SpookyKit --allow-writing-to-package-directory format"

[tasks."swift:lint"]
description = "检查 Swift 代码规范"
run = "mise run swift:format --lint"
