name: Bug report
description: Report unexpected behavior in Spooky.

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search [existing issues](https://github.com/rakuyoMo/Spooky/issues) to avoid duplicates.

        Remove tokens, private keys, and other sensitive information before uploading any materials.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and what actually happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        List the steps in order. For intermittent issues,
        describe what you were doing before the issue occurred.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: input
    id: spooky-version
    attributes:
      label: Spooky version
      description: Enter the app version, or the commit hash if you built Spooky from source.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Enter the macOS version on the machine running Spooky.
    validations:
      required: true

  - type: dropdown
    id: repository-location
    attributes:
      label: Repository location
      options:
        - Local machine
        - SSH server
        - Both
        - Not related to a repository
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Git and server environment
      description: >-
        Include the Git versions on the relevant machines.
        For SSH issues, also include the server operating system.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include error messages, logs, screenshots, recordings, or a minimal reproduction repository.
