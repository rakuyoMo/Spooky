# 标题为 `release: <版本号>` 的 PR 合并进 main 后，打包并发布 GitHub Release；公测版与内测版发布为 pre-release

name: 发布

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  release:
    name: 发布新版本

    # `startsWith` 不区分大小写，标题的完整格式由发布检查脚本严格检查
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.title, 'release:')

    # 测试与发布用同一个镜像与同一版 Xcode，改版本时与 ci.yml 一起改
    runs-on: xcode-27

    permissions:
      contents: write

    # PR 标题由用户填写，只经环境变量交给脚本，不直接展开进 shell
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}

      # 固定 Xcode 版本，镜像更新默认版本时不跟着变
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      # 打包与打标签都基于 PR 合并进 main 后产生的提交；第一父提交是合并前的 main
      - name: 检出合并提交
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      # 与本机发版、release PR 共用一份检查：标题、版本号、构建号、更新说明与远端标签；通过后记下版本号与通道
      - name: 发布检查
        run: ./scripts/check-release.sh --title "$PR_TITLE" --base "${MERGE_COMMIT_SHA}^" >> "$GITHUB_ENV"

      - name: 安装 mise
        uses: jdx/mise-action@v4

      # 缺少签名密钥时不发布不能自动安装的版本
      - name: 检查更新签名配置
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::请配置 SPARKLE_PRIVATE_KEY 仓库 secret"
            exit 1
          fi

      - name: 打包
        run: mise run bundle

      # App 读标为 latest 的 Release 上的更新清单，pre-release 不能标为 latest，所以这一份总在最新的稳定版上；
      # 公测版与内测版的清单要带上更稳定的通道里最新的条目，从这一份合成，发布后再换掉它
      - name: 取上一份更新清单
        if: env.CHANNEL != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不给标签时取最新的稳定版；还没有稳定版时这一步失败，清单无处可放，不发布
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir build/previous

          echo "FEED_TAG=$tag" >> "$GITHUB_ENV"
          echo "PREVIOUS_FEED=build/previous/appcast.xml" >> "$GITHUB_ENV"

      - name: 压缩并签名更新清单
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run appcast ${PREVIOUS_FEED:+"$PREVIOUS_FEED"}

      # 一步完成打标签、创建 Release、上传 zip 与更新清单；标签打在合并提交上，名称与标签相同，正文是这一版的英文更新说明
      # 稳定版标为 latest，公测版与内测版标为 pre-release
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_type="--latest"

          if [[ "$CHANNEL" != "stable" ]]; then
            release_type="--prerelease"
          fi

          gh release create "v$VERSION" \
            "build/updates/Spooky-$VERSION.zip" \
            "build/updates/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_COMMIT_SHA" \
            --title "v$VERSION" \
            --notes-file "docs/release-notes/$VERSION/en.md" \
            "$release_type"

      # 公测版与内测版的清单换掉最新稳定版上的那一份，选了这些通道的用户从中收到这一版；
      # 这一步失败时，从刚建好的 Release 取下 appcast.xml，照这条命令手动换上
      - name: 换掉稳定版上的更新清单
        if: env.CHANNEL != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$FEED_TAG" build/updates/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
