# 提 PR 与推送到 main 时，检查代码规范、编译、测试并打包

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同一 PR 的新推送取消旧运行；推送到 main 按提交各自分组，互不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建

    # 测试与发布用同一个镜像与同一版 Xcode，改版本时与 release.yml 一起改
    runs-on: xcode-27

    # 固定 Xcode 版本，镜像更新默认版本时不跟着变
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: 检查代码规范
        run: mise run swift:lint

      - name: 编译
        run: mise run build

      # 测试的输出接到管道上时攒成整块再写，日志里每行的时间不是测试结束的时间；事件流里每个事件都带着发生的时间
      # 这两个选项不列在 swift test 的帮助里
      - name: 测试
        run: |
          mise run test \
            --event-stream-output-path "$RUNNER_TEMP/test-events.jsonl" \
            --event-stream-version 0

      # 测试失败时同样上传；产物名带上第几次运行，重跑时不与前一次重名
      - name: 上传测试事件
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-events-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-events.jsonl

      - name: 打包
        run: mise run bundle
