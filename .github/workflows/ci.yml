name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: 测试 ${{ matrix.n }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - uses: jdx/mise-action@v4

      - name: 测试
        run: |
          sw_vers
          swift test --filter 'ActivityWindowTests|ActivityWindowProbe' 2>&1 | grep -E 'PROBE|ActivityWindow|✘|↳|error:'
